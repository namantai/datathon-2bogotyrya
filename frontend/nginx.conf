worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # 128 MiB file + multipart overhead; Backend enforces the exact limits.
        client_max_body_size 129m;
        client_header_timeout 10s;
        client_body_timeout 60s;
        send_timeout 60s;
        keepalive_timeout 10s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Re-resolve Docker service DNS after backend recreation/IP changes.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_address backend:8000;
        location ~ ^/(api/|ui-api/|health$) {
            # No URI suffix: preserve the original API path and query string.
            proxy_pass http://$backend_address;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            # Origin, Cookie, CSRF and X-API-Key are forwarded unchanged.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;
        }
        location ~ /\. { deny all; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
